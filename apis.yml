image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/samora-ai.png
name: Samora AI
description: >-
  Samora AI is a Y Combinator (W2026) company building multilingual voice agents
  that automate high-volume inbound and outbound calling for financial services,
  recruitment, healthcare, and government. Its agents handle natural conversation
  across 20+ languages with interruption handling, code-switching, and escalation
  to human operators, plus omnichannel support (voice, WhatsApp, SMS, email) and
  CRM integration. Samora exposes a server-to-server REST API to trigger outbound
  calls, manage outbound calling campaigns and their scheduled recipients, and
  subscribe to real-time call events through signed webhooks. Authentication is an
  organization API key sent in the X-API-Key header; the base URL is
  https://api.samora.ai and the developer documentation is at https://docs.samora.ai.
