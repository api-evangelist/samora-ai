- status: 409
  title: Invalid State Transition
  remediation: >-
    The campaign is in a state that does not permit this operation. Add
    recipients/start only from DRAFT or PAUSED; stop only from IN_PROGRESS;
    cancel only from a non-terminal state.
  source_operations: [addScheduledCalls, startCampaign, stopCampaign, cancelCampaign]
- status: 429
  title: Too Many Requests
  remediation: Back off and retry; respect documented rate limits and the 2 MiB request-body cap.
